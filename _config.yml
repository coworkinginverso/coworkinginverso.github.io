# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Coworking di Inverso Pinasca
email: coworking@comune.inversopinasca.to.it
description: >- # this means to ignore newlines until "baseurl:"
  Ex-scuola elementare della borgata Clot, rifunzionalizzata in struttura di co-working con il contributo del GAL-EVV
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com
#twitter_username: jekyllrb
github_username:  coworkinginverso
lang: it

# Build settings
#theme: jekyll-theme-so-simple
remote_theme: "mmistakes/so-simple-theme@3.2.0"
#skin: "https://raw.githubusercontent.com/mmistakes/so-simple-theme/refs/heads/master/assets/css/skins/dark.scss"
skin: "assets/css/skins/dark.css"
markdown: kramdown

search_full_content: true

locale: it-IT

date_format: "%d/%m/%Y"

plugins:
  - jekyll-feed
  - jekyll-sitemap
defaults:
 -
  values:
   layout: "page"
footer_links:
 - title: Email
   url: mailto:coworking@comune.inversopinasca.to.it
   icon: fas fa-envelope
 - title: Telefono
   url: tel:0121800706
   icon: fas fa-phone
 - title: Posizione
   url: https://www.google.com/maps/place/Via+Remo+Vola,+2,+10060+Clot+TO/@44.9425911,7.2150601,17z/data=!3m1!4b1!4m15!1m8!3m7!1s0x4788321c3b47d185:0x405e67d473c8b80!2s10060+Inverso+Pinasca+TO!3b1!8m2!3d44.9410601!4d7.21768!16zL20vMGc2d2xm!3m5!1s0x478832219ff8f3a7:0xaadebbc97c73d557!8m2!3d44.9425911!4d7.2173541!16s%2Fg%2F11x84c6p24!5m1!1e4?entry=ttu&g_ep=EgoyMDI1MTExNy4wIKXMDSoASAFQAw%3D%3D
   icon: fas fa-map-marker-alt
 - title: Instagram
   url: https://www.instagram.com/coworking_inverso/
   icon: fab fa-instagram
 - title: Feed RSS
   url: feed.xml
   icon: fas fa-rss

